services:
    db:
        image: postgres:17-alpine
        deploy:
            placement:
                constraints:
                    - "node.labels.db == true"
        container_name: mmv-db
        volumes:
             -  ./docker/data/postgres/data:/var/lib/postgresql/data
             -  ./deployment/config/postgres/postgresql.conf:/var/lib/postgresql/postgresql.conf
        ports:
            - "${DB_HOST_PORT:-5439}:5432"
        environment:
            POSTGRES_USER: "${DB_USER:-user}"
            POSTGRES_PASSWORD: "${DB_PASSWORD:-password}"
            POSTGRES_DB: "${DB_DATABASE:-mmv}"
            PGDATA: /var/lib/postgresql/data
        networks:
            - mmv-network
        command: ["postgres", "-c", "config_file=/var/lib/postgresql/postgresql.conf"]

    laravel:
        build:
            context: .
            dockerfile: ./deployment/dockerfiles/DockerFile.php
            target: api
            args:
                - user=mmv-user
                - uid=1000
        container_name: mmv-app
        tty: true
        volumes:
            - .:/var/www/mmv
        ports:
            - "${LARAVEL_PORT:-9002}:80"
        networks:
            - mmv-network

        depends_on:
            - db
            - redis

    nginx:
        image: nginx:alpine
        container_name: mmv-nginx
        restart: unless-stopped
        tty: true
        ports:
            - "${NGINX_PORT:-7778}:80"
        volumes:
            - ./deployment/config/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - .:/var/www/mmv
        depends_on:
            - laravel
        networks:
            - mmv-network

    redis:
        image: redis:alpine
        container_name: mmv-redis
        deploy:
            placement:
                constraints:
                    - "node.labels.db == true"
        volumes:
            - ./docker/data/redisdata:/data
        ports:
            - "${REDIS_HOST_PORT:-6377}:6379"
        networks:
            - mmv-network

volumes:
    db_data:
        driver: local

networks:
    mmv-network:
        driver: bridge